# KLK page image URL (custom attribute)

display_type: hidden
pattern: <a href="<%= funcs.makeKlkPageImageUrl({struct_attrs, pos_attrs, tokens},
  0) %>" class="exturl sidebar_link" target="_blank"><span rel="localize[show_page_image]"></span></a>
custom_type: struct
hide_compare: true
hide_extended: true
hide_statistics: true
url_opts:
  hideUrl: true
  inLinkSection: true
  newWindow: true
