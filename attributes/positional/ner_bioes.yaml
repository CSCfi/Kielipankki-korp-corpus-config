label:
  eng: word position in a name
  fin: sanan sijainti nimessä
  swe: ordets läge i namnet
extended_component: datasetSelect
dataset:
- B
- I
- E
- S
# Translation keys are 3-letter (eng/swe/fin) to match the Mink Korp language
# codes (korp.languages in config_default.yaml). 2-letter keys (en/fi/sv), as
# used by the main-KLK presets, resolve to undefined here and blank/crash the UI.
translation:
  B:
    eng: beginning (B)
    fin: alussa (B)
    swe: början (B)
  I:
    eng: inside (I)
    fin: sisällä (I)
    swe: innanför (I)
  E:
    eng: ending (E)
    fin: lopussa (E)
    swe: slutet (E)
  S:
    eng: single (S)
    fin: yksittäinen (S)
    swe: enskilt (S)
